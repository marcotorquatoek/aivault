<!DOCTYPE html>
<!-- version: 4.2 -->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Links Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f7f4;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --text: #1a1a1a;
      --text-muted: #7a7770;
      --text-hint: #b0ada8;
      --accent-fg: #ffffff;
      --danger: #c0392b;
      --danger-bg: #fdf1f0;
      --radius: 10px;
      --radius-lg: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; }

    .header { padding: 22px 20px 10px; background: var(--surface); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .header h1 { font-size: 19px; font-weight: 500; letter-spacing: -0.3px; }
    .version-badge { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-hint); background: var(--bg); border: 0.5px solid var(--border); padding: 3px 8px; border-radius: 20px; }
    .status { font-size: 12px; color: var(--text-hint); }

    .search-wrap { padding: 10px 16px; background: var(--surface); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .search-inner { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 0.5px solid var(--border-strong); border-radius: 20px; padding: 8px 14px; }
    .search-inner input { flex: 1; border: none; background: transparent; font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
    .search-inner input::placeholder { color: var(--text-hint); }
    #search-clear { font-size: 14px; color: var(--text-hint); cursor: pointer; display: none; }

    .main-tabs { display: flex; padding: 10px 16px; gap: 6px; background: var(--surface); border-bottom: 0.5px solid var(--border); flex-shrink: 0; transition: opacity 0.2s; overflow-x: auto; scrollbar-width: none; }
    .main-tabs::-webkit-scrollbar { display: none; }
    .mtab { padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 400; cursor: pointer; border: 0.5px solid transparent; color: var(--text-muted); background: transparent; font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap; }
    .mtab.active { background: var(--text); color: var(--accent-fg); font-weight: 500; }

    .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .section { padding: 16px; }

    /* Cartella rows */
    .cartella-list { display: flex; flex-direction: column; gap: 8px; }
    .cartella-browse-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); cursor: default; transition: background 0.15s; }
    .cartella-browse-row.dragging { opacity: 0.4; }
    .cartella-browse-row.drag-over { border-color: var(--text); }
    .drag-handle { font-size: 16px; color: var(--text-hint); cursor: grab; padding: 0 4px; flex-shrink: 0; user-select: none; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .cartella-browse-main { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; min-width: 0; }
    .cartella-browse-name { flex: 1; font-size: 15px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cartella-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-hint); background: var(--bg); border: 0.5px solid var(--border); padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
    .chevron { font-size: 14px; color: var(--text-hint); flex-shrink: 0; }

    /* Creator rows in manage view */
    .creator-manage-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 8px; }
    .creator-bubble { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: white; flex-shrink: 0; }
    .creator-info { flex: 1; min-width: 0; }
    .creator-handle { font-size: 15px; color: var(--text); }
    .creator-ig-link { font-size: 11px; color: var(--text-hint); text-decoration: none; }
    .creator-ig-link:hover { text-decoration: underline; }

    /* Row actions */
    .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 0.5px solid var(--border); background: var(--bg); cursor: pointer; display: flex; align-items: center; font-size: 12px; font-weight: 500; color: var(--text-muted); font-family: 'DM Sans', sans-serif; gap: 4px; white-space: nowrap; }
    .icon-btn:active { background: #eee; }
    .icon-btn.danger { border-color: rgba(192,57,43,0.2); background: var(--danger-bg); color: var(--danger); }

    /* Link cards */
    .link-card { padding: 14px 16px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 8px; }
    .link-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .link-bubble { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: white; flex-shrink: 0; }
    .link-info { flex: 1; min-width: 0; }
    .link-title { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .link-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .meta-handle { font-size: 12px; color: var(--text-muted); }
    .meta-tag { font-size: 11px; color: var(--text-hint); background: var(--bg); border: 0.5px solid var(--border); padding: 2px 8px; border-radius: 10px; }
    .link-actions { display: flex; gap: 8px; }
    .btn-open { flex: 1; padding: 9px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-open:active { background: #eee; }
    .btn-edit { padding: 9px 12px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--text-muted); font-family: 'DM Sans', sans-serif; }
    .btn-del { padding: 9px 12px; background: var(--danger-bg); border: 0.5px solid rgba(192,57,43,0.2); border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--danger); font-family: 'DM Sans', sans-serif; }

    /* Form */
    .form-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 8px; }
    .form-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
    .input-group { margin-bottom: 13px; }
    .label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
    input[type=text], select { width: 100%; padding: 11px 14px; font-size: 15px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-appearance: none; appearance: none; }
    input[type=text]:focus, select:focus { outline: none; border-color: var(--text); }
    input[type=color] { width: 44px; height: 44px; border-radius: 50%; border: 0.5px solid var(--border-strong); padding: 2px; cursor: pointer; background: none; }
    .color-row { display: flex; align-items: center; gap: 12px; }
    .color-row input[type=text] { flex: 1; }
    .btn-primary { width: 100%; padding: 13px; background: var(--text); color: var(--accent-fg); border: none; border-radius: var(--radius); font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.4; }
    .input-prefix { position: relative; }
    .input-prefix span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-muted); pointer-events: none; }
    .input-prefix input { padding-left: 26px; }
    .section-label { font-size: 11px; font-weight: 500; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; margin-top: 18px; }

    /* Select + add creator inline */
    .select-plus-row { display: flex; gap: 8px; align-items: stretch; }
    .select-plus-row select { flex: 1; }
    .btn-plus { padding: 0 14px; background: var(--bg); border: 0.5px solid var(--border-strong); border-radius: var(--radius); font-size: 20px; cursor: pointer; color: var(--text-muted); font-family: 'DM Sans', sans-serif; display: flex; align-items: center; }
    .btn-plus:active { background: #eee; }
    .inline-add-box { background: var(--bg); border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 12px; margin-top: 8px; display: none; }
    .inline-add-box.open { display: block; }
    .inline-add-row { display: flex; gap: 8px; align-items: center; }
    .inline-add-row input { flex: 1; padding: 9px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); font-family: 'DM Sans', sans-serif; outline: none; color: var(--text); }
    .btn-inline-save { padding: 9px 14px; background: var(--text); color: white; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }

    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; margin-bottom: 16px; background: none; border: none; font-family: 'DM Sans', sans-serif; padding: 0; }
    .section-heading { font-size: 17px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    .empty { text-align: center; padding: 48px 20px; color: var(--text-hint); font-size: 14px; line-height: 1.6; }
    .empty-icon { font-size: 32px; display: block; margin-bottom: 10px; }

    .search-results-header { font-size: 12px; color: var(--text-hint); margin-bottom: 12px; font-family: 'DM Mono', monospace; }
    mark.hl { background: #fff3cd; border-radius: 2px; padding: 0 1px; font-style: normal; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0); transition: background 0.25s; z-index: 150; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; }
    .modal-overlay.open { background: rgba(0,0,0,0.45); pointer-events: all; }
    .modal { width: 100%; max-width: 480px; background: var(--surface); border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); padding-bottom: 32px; max-height: 90vh; overflow-y: auto; }
    .modal.open { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 12px auto 0; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 0.5px solid var(--border); }
    .modal-header h3 { font-size: 15px; font-weight: 500; }
    .modal-close { width: 30px; height: 30px; border: none; background: var(--bg); border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 16px; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--accent-fg); padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 300; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .toast.show { opacity: 1; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>AI Links Vault</h1>
      <span class="version-badge">v4.2</span>
    </div>
    <div class="status" id="status-text">Connessione…</div>
  </div>

  <div class="search-wrap">
    <div class="search-inner">
      <span style="color:var(--text-hint)">🔍</span>
      <input type="text" id="search-input" placeholder="Cerca titolo, creator, cartella…" oninput="onSearch()" />
      <span id="search-clear" onclick="clearSearch()">✕</span>
    </div>
  </div>

  <div class="main-tabs" id="main-tabs">
    <button class="mtab active" onclick="showMain('browse')" id="mtab-browse">Sfoglia</button>
    <button class="mtab" onclick="showMain('link')" id="mtab-link">+ Link</button>
    <button class="mtab" onclick="showMain('creator')" id="mtab-creator">+ Creator</button>
    <button class="mtab" onclick="showMain('cartella')" id="mtab-cartella">+ Cartella</button>
  </div>

  <div class="scroll-area">
    <div id="view-browse" class="section"></div>
    <div id="view-link" class="section" style="display:none"></div>
    <div id="view-creator" class="section" style="display:none"></div>
    <div id="view-cartella" class="section" style="display:none"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="modal-title">Modifica</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB = 'https://kyqhkromuwjenkffvkqe.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5cWhrcm9tdXdqZW5rZmZ2a3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDQ1NzAsImV4cCI6MjA5NDA4MDU3MH0.QuDYyRVZy0MSxVzd3KVT8R6I1z8BFU3kh0vgr-7BiQw';
const H = {'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};

const PALETTE = ['#e07b54','#5b8dd9','#6abf8a','#b87fcf','#d4a843','#5bbfbf','#d96b8a','#7a9e6b','#c46b3a','#7b7fd4','#e05c8a','#4aa8a0'];

let creators=[], links=[], cartelle=[], currentSection=null, currentMain='browse';
let dragSrc=null;

function randColor(){ return PALETTE[Math.floor(Math.random()*PALETTE.length)]; }
function initials(str){ const s=(str||'?').replace(/^@/,''); return s.slice(0,2).toUpperCase(); }
function bubbleEl(name, color, size){
  const sz=size||36;
  return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${color||randColor()};display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*0.36)}px;font-weight:500;color:white;flex-shrink:0">${initials(name)}</div>`;
}

async function api(method, path, body){
  const r=await fetch(SB+'/rest/v1/'+path,{
    method, headers:{...H,'Prefer':method==='POST'?'return=representation':'return=minimal'},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok){ const t=await r.text(); throw new Error(t||r.status); }
  if(method==='DELETE'||method==='PATCH') return null;
  const t=await r.text(); return t?JSON.parse(t):null;
}

async function loadAll(){
  try {
    // Run migrations silently
    await Promise.allSettled([
      api('PATCH','cartelle?id=neq.00000000-0000-0000-0000-000000000000',{}), // no-op
      fetch(SB+'/rest/v1/rpc/exec',{method:'POST',headers:H}), // no-op
    ]);
    [creators, links, cartelle] = await Promise.all([
      api('GET','creators?select=*&order=created_at.asc'),
      api('GET','links?select=*&order=created_at.desc'),
      api('GET','cartelle?select=*&order=sort_order.asc,created_at.asc')
    ]);
    // Assign missing colors locally
    creators.forEach(c=>{ if(!c.color) c.color=randColor(); });
    cartelle.forEach(c=>{ if(!c.color) c.color=randColor(); });
    updateStatus();
  } catch(e){ document.getElementById('status-text').textContent='Errore: '+e.message; }
  renderAll();
}

function updateStatus(){ document.getElementById('status-text').textContent=cartelle.length+' cartelle · '+links.length+' link'; }
function renderAll(){ renderBrowse(); renderViewLink(); renderViewCreator(); renderViewCartella(); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hlText(text,q){
  if(!q||!text) return esc(text||'');
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark class="hl">$1</mark>');
}

function showMain(tab){
  clearSearch();
  ['browse','link','creator','cartella'].forEach(t=>{
    document.getElementById('view-'+t).style.display=t===tab?'':'none';
    document.getElementById('mtab-'+t).className='mtab'+(t===tab?' active':'');
  });
  currentMain=tab;
  if(tab==='browse'){ currentSection=null; renderBrowse(); }
}

/* ── BROWSE (cartelle-first) ── */
function renderBrowse(){
  const el=document.getElementById('view-browse');
  el.className='section fade-in';
  if(currentSection){
    const sec=currentSection;
    const fl = sec.id==='__none__' ? links.filter(l=>!l.cartella_id) : links.filter(l=>l.cartella_id===sec.id);
    const dotColor = sec.color||'#aaa';
    let html=`<button class="back-btn" onclick="currentSection=null;renderBrowse()">← Cartelle</button>
    <div class="section-heading"><span style="width:14px;height:14px;border-radius:50%;background:${dotColor};display:inline-block;flex-shrink:0"></span>${esc(sec.name)}</div>`;
    if(!fl.length) html+=`<div class="empty"><span class="empty-icon">🔖</span>Nessun link in questa cartella</div>`;
    else fl.forEach(l=>{ html+=linkCardHtml(l,''); });
    el.innerHTML=html;
    return;
  }
  if(!cartelle.length && !links.filter(l=>!l.cartella_id).length){
    el.innerHTML=`<div class="empty"><span class="empty-icon">📁</span>Nessuna cartella ancora<br><small>Usa "+ Cartella" per crearne una</small></div>`;
    return;
  }
  let html='<div class="cartella-list" id="cartella-list">';
  cartelle.forEach((c,i)=>{
    const count=links.filter(l=>l.cartella_id===c.id).length;
    html+=`<div class="cartella-browse-row" draggable="true"
      ondragstart="dragStart(event,'${c.id}')"
      ondragover="dragOver(event)"
      ondrop="dragDrop(event,'${c.id}')"
      ondragend="dragEnd(event)"
      data-id="${c.id}">
      <span class="drag-handle" title="Trascina per riordinare">⠿</span>
      <span class="color-dot" style="background:${c.color||'#aaa'}"></span>
      <div class="cartella-browse-main" onclick='openSection(${JSON.stringify(c)})'>
        <span class="cartella-browse-name">${esc(c.name)}</span>
        <span class="cartella-count">${count}</span>
        <span class="chevron">›</span>
      </div>
      <div class="row-actions">
        <button class="icon-btn" onclick='editCartella(${JSON.stringify(c)})'>✏️</button>
        <button class="icon-btn danger" onclick="deleteCartella('${c.id}')">🗑</button>
      </div>
    </div>`;
  });
  const uncategorized=links.filter(l=>!l.cartella_id);
  if(uncategorized.length){
    html+=`<div class="cartella-browse-row">
      <span class="drag-handle" style="opacity:0">⠿</span>
      <span class="color-dot" style="background:#ccc"></span>
      <div class="cartella-browse-main" onclick="openSection({id:'__none__',name:'Senza cartella',color:'#ccc'})">
        <span class="cartella-browse-name" style="color:var(--text-muted)">Senza cartella</span>
        <span class="cartella-count">${uncategorized.length}</span>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }
  el.innerHTML=html+'</div>';
}
function openSection(c){ currentSection=c; renderBrowse(); }

/* ── Drag & Drop reorder ── */
function dragStart(e,id){ dragSrc=id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('drag-over'); }
function dragEnd(e){ e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); }
async function dragDrop(e,targetId){
  e.preventDefault();
  if(dragSrc===targetId) return;
  const fromIdx=cartelle.findIndex(c=>c.id===dragSrc);
  const toIdx=cartelle.findIndex(c=>c.id===targetId);
  if(fromIdx===-1||toIdx===-1) return;
  const moved=cartelle.splice(fromIdx,1)[0];
  cartelle.splice(toIdx,0,moved);
  // Save new order
  try {
    await Promise.all(cartelle.map((c,i)=>api('PATCH',`cartelle?id=eq.${c.id}`,{sort_order:i})));
    cartelle.forEach((c,i)=>c.sort_order=i);
  } catch(e){ /* silent */ }
  renderBrowse();
}

function linkCardHtml(l,q){
  const creator=creators.find(c=>c.id===l.creator_id);
  const cartella=cartelle.find(c=>c.id===l.cartella_id);
  const handle=creator?('@'+creator.name.replace(/^@/,'')):null;
  const color=creator?creator.color:'#aaa';
  const tags=[
    handle?`<span class="meta-handle">${hlText(handle,q)}</span>`:'',
    cartella?`<span class="meta-tag">📁 ${hlText(cartella.name,q)}</span>`:'',
  ].filter(Boolean).join('');
  const uE=esc(l.url);
  return `<div class="link-card">
    <div class="link-card-top">
      ${bubbleEl(creator?creator.name:'?', color)}
      <div class="link-info">
        <div class="link-title">${hlText(l.title,q)}</div>
        <div class="link-meta">${tags}</div>
      </div>
    </div>
    <div class="link-actions">
      <button class="btn-open" onclick="window.open('${uE}','_blank')">↗ Apri</button>
      <button class="btn-edit" onclick='editLink(${JSON.stringify(l)})'>✏️</button>
      <button class="btn-del" onclick="deleteLink('${l.id}')">🗑</button>
    </div>
  </div>`;
}

/* ── View: + Link ── */
function renderViewLink(){
  const el=document.getElementById('view-link');
  const cOpts=creators.map(c=>`<option value="${c.id}">${esc('@'+c.name.replace(/^@/,''))}</option>`).join('');
  const kOpts=cartelle.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  el.innerHTML=`
    <div class="form-card">
      <div class="form-title">Nuovo link</div>
      <div class="input-group"><div class="label">Titolo</div>
        <input type="text" id="nl-title" placeholder="es. Guida Midjourney V6" /></div>
      <div class="input-group"><div class="label">URL</div>
        <input type="text" id="nl-url" placeholder="https://…" autocapitalize="none" autocorrect="off" /></div>
      <div class="input-group">
        <div class="label">Creator</div>
        <div class="select-plus-row">
          <select id="nl-creator">${creators.length?cOpts:'<option value="">— Nessun creator —</option>'}</select>
          <button class="btn-plus" onclick="toggleInlineAdd()" title="Aggiungi nuovo creator">＋</button>
        </div>
        <div class="inline-add-box" id="inline-add-box">
          <div class="label" style="margin-bottom:8px">Nuovo creator</div>
          <div class="inline-add-row">
            <div style="position:relative;flex:1"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px">@</span><input type="text" id="inline-creator-name" placeholder="handle" autocapitalize="none" style="padding-left:24px" /></div>
            <button class="btn-inline-save" onclick="inlineAddCreator()">Aggiungi</button>
          </div>
        </div>
      </div>
      <div class="input-group"><div class="label">Cartella</div>
        <select id="nl-cartella"><option value="">— Nessuna —</option>${kOpts}</select></div>
      <button class="btn-primary" onclick="addLink()" id="add-link-btn">Salva link</button>
    </div>`;
}

function toggleInlineAdd(){
  const box=document.getElementById('inline-add-box');
  box.classList.toggle('open');
  if(box.classList.contains('open')) document.getElementById('inline-creator-name').focus();
}

async function inlineAddCreator(){
  const raw=document.getElementById('inline-creator-name').value.trim().replace(/^@/,'');
  if(!raw) return toast('Inserisci un handle');
  try {
    const color=randColor();
    const res=await api('POST','creators',{name:raw,color});
    const c={...res[0],color};
    creators.push(c);
    toast('Creator aggiunto ✓');
    document.getElementById('inline-creator-name').value='';
    document.getElementById('inline-add-box').classList.remove('open');
    // rebuild select and select new
    const sel=document.getElementById('nl-creator');
    const opt=document.createElement('option');
    opt.value=c.id; opt.textContent='@'+raw; sel.appendChild(opt); sel.value=c.id;
    renderViewCreator();
  } catch(e){ toast('Errore: '+e.message); }
}

/* ── View: + Creator ── */
function renderViewCreator(){
  const el=document.getElementById('view-creator');
  let list='';
  if(creators.length){
    list='<div class="section-label">Creator esistenti</div>';
    creators.forEach(c=>{
      const count=links.filter(l=>l.creator_id===c.id).length;
      const handle=c.name.replace(/^@/,'');
      list+=`<div class="creator-manage-row">
        ${bubbleEl(c.name, c.color)}
        <div class="creator-info">
          <div class="creator-handle">@${esc(handle)}</div>
          <a class="creator-ig-link" href="https://www.instagram.com/${esc(handle)}/" target="_blank">↗ instagram.com/${esc(handle)}</a>
        </div>
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-hint);margin-right:4px">${count}</span>
        <div class="row-actions">
          <button class="icon-btn" onclick='editCreator(${JSON.stringify(c)})'>✏️ Modifica</button>
          <button class="icon-btn danger" onclick="deleteCreator('${c.id}')">🗑 Elimina</button>
        </div>
      </div>`;
    });
  }
  const newColor=randColor();
  el.innerHTML=`
    <div class="form-card">
      <div class="form-title">Nuovo creator</div>
      <div class="input-group"><div class="label">Handle Instagram</div>
        <div class="input-prefix"><span>@</span>
        <input type="text" id="nc-name" placeholder="lumonboy" autocapitalize="none" autocorrect="off" /></div></div>
      <div class="input-group"><div class="label">Colore</div>
        <div class="color-row">
          <input type="color" id="nc-color" value="${newColor}" oninput="document.getElementById('nc-color-hex').value=this.value" />
          <input type="text" id="nc-color-hex" value="${newColor}" placeholder="#e07b54" oninput="document.getElementById('nc-color').value=this.value" />
          <button type="button" onclick="const c=randColor();document.getElementById('nc-color').value=c;document.getElementById('nc-color-hex').value=c" style="padding:0 10px;height:44px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:18px" title="Colore casuale">🎲</button>
        </div>
      </div>
      <button class="btn-primary" onclick="addCreator()">Aggiungi creator</button>
    </div>${list}`;
}

/* ── View: + Cartella ── */
function renderViewCartella(){
  const el=document.getElementById('view-cartella');
  let list='';
  if(cartelle.length){
    list='<div class="section-label">Cartelle esistenti</div>';
    cartelle.forEach(c=>{
      const count=links.filter(l=>l.cartella_id===c.id).length;
      list+=`<div class="cartella-browse-row" style="margin-bottom:8px">
        <span class="color-dot" style="background:${c.color||'#aaa'}"></span>
        <span style="flex:1;font-size:15px">${esc(c.name)}</span>
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-hint);margin-right:8px">${count} link</span>
        <div class="row-actions">
          <button class="icon-btn" onclick='editCartella(${JSON.stringify(c)})'>✏️ Modifica</button>
          <button class="icon-btn danger" onclick="deleteCartella('${c.id}')">🗑 Elimina</button>
        </div>
      </div>`;
    });
  }
  const newColor=randColor();
  el.innerHTML=`
    <div class="form-card">
      <div class="form-title">Nuova cartella</div>
      <div class="input-group"><div class="label">Nome</div>
        <input type="text" id="nk-name" placeholder="es. Tutorial, Ispirazione, AI Tools…" /></div>
      <div class="input-group"><div class="label">Colore</div>
        <div class="color-row">
          <input type="color" id="nk-color" value="${newColor}" oninput="document.getElementById('nk-color-hex').value=this.value" />
          <input type="text" id="nk-color-hex" value="${newColor}" placeholder="#5b8dd9" oninput="document.getElementById('nk-color').value=this.value" />
          <button type="button" onclick="const c=randColor();document.getElementById('nk-color').value=c;document.getElementById('nk-color-hex').value=c" style="padding:0 10px;height:44px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:18px" title="Colore casuale">🎲</button>
        </div>
      </div>
      <button class="btn-primary" onclick="addCartella()">Crea cartella</button>
    </div>${list}`;
}

/* ── CRUD Link ── */
async function addLink(){
  const title=document.getElementById('nl-title').value.trim();
  const url=document.getElementById('nl-url').value.trim();
  const creator_id=document.getElementById('nl-creator').value||null;
  const cartella_id=document.getElementById('nl-cartella').value||null;
  if(!title) return toast('Inserisci un titolo');
  if(!url) return toast('Inserisci un URL');
  const btn=document.getElementById('add-link-btn');
  btn.innerHTML='<span class="spinner"></span>Salvataggio…'; btn.disabled=true;
  try {
    const res=await api('POST','links',{title,url,creator_id,cartella_id});
    links.unshift(res[0]);
    document.getElementById('nl-title').value='';
    document.getElementById('nl-url').value='';
    toast('Link salvato ✓'); updateStatus(); renderViewLink(); renderBrowse();
  } catch(e){ toast('Errore: '+e.message); btn.innerHTML='Salva link'; btn.disabled=false; }
}

async function deleteLink(id){
  if(!confirm('Eliminare questo link?')) return;
  try {
    await api('DELETE','links?id=eq.'+id);
    links=links.filter(l=>l.id!==id);
    toast('Eliminato'); updateStatus();
    const q=document.getElementById('search-input').value.trim();
    if(q) renderSearch(q); else renderBrowse();
  } catch(e){ toast('Errore'); }
}

function editLink(l){
  const cOpts=creators.map(c=>`<option value="${c.id}"${c.id===l.creator_id?' selected':''}>${esc('@'+c.name.replace(/^@/,''))}</option>`).join('');
  const kOpts=cartelle.map(c=>`<option value="${c.id}"${c.id===l.cartella_id?' selected':''}>${esc(c.name)}</option>`).join('');
  document.getElementById('modal-title').textContent='Modifica link';
  document.getElementById('modal-body').innerHTML=`
    <div class="input-group"><div class="label">Titolo</div>
      <input type="text" id="el-title" value="${esc(l.title)}" /></div>
    <div class="input-group"><div class="label">URL</div>
      <input type="text" id="el-url" value="${esc(l.url)}" autocapitalize="none" /></div>
    <div class="input-group"><div class="label">Creator</div>
      <select id="el-creator"><option value="">— Nessuno —</option>${cOpts}</select></div>
    <div class="input-group"><div class="label">Cartella</div>
      <select id="el-cartella"><option value="">— Nessuna —</option>${kOpts}</select></div>
    <button class="btn-primary" onclick="saveLink('${l.id}')">Salva modifiche</button>`;
  openModal();
}

async function saveLink(id){
  const title=document.getElementById('el-title').value.trim();
  const url=document.getElementById('el-url').value.trim();
  const creator_id=document.getElementById('el-creator').value||null;
  const cartella_id=document.getElementById('el-cartella').value||null;
  if(!title||!url) return toast('Compila titolo e URL');
  try {
    await api('PATCH','links?id=eq.'+id,{title,url,creator_id,cartella_id});
    const i=links.findIndex(l=>l.id===id);
    if(i>-1) links[i]={...links[i],title,url,creator_id,cartella_id};
    toast('Salvato ✓'); closeModal(); updateStatus();
    const q=document.getElementById('search-input').value.trim();
    if(q) renderSearch(q); else renderBrowse();
  } catch(e){ toast('Errore: '+e.message); }
}

/* ── CRUD Creator ── */
async function addCreator(){
  const raw=document.getElementById('nc-name').value.trim().replace(/^@/,'');
  const color=document.getElementById('nc-color').value||randColor();
  if(!raw) return toast('Inserisci un handle');
  try {
    const res=await api('POST','creators',{name:raw,color});
    creators.push({...res[0],color});
    document.getElementById('nc-name').value='';
    toast('Creator aggiunto ✓'); updateStatus(); renderViewCreator(); renderViewLink(); renderBrowse();
  } catch(e){ toast('Errore: '+e.message); }
}

function editCreator(c){
  document.getElementById('modal-title').textContent='Modifica creator';
  document.getElementById('modal-body').innerHTML=`
    <div class="input-group"><div class="label">Handle Instagram</div>
      <div class="input-prefix"><span>@</span>
      <input type="text" id="ec-name" value="${esc(c.name.replace(/^@/,''))}" autocapitalize="none" /></div></div>
    <div class="input-group"><div class="label">Colore</div>
      <div class="color-row">
        <input type="color" id="ec-color" value="${c.color||'#e07b54'}" oninput="document.getElementById('ec-color-hex').value=this.value" />
        <input type="text" id="ec-color-hex" value="${c.color||'#e07b54'}" oninput="document.getElementById('ec-color').value=this.value" />
        <button type="button" onclick="const c=randColor();document.getElementById('ec-color').value=c;document.getElementById('ec-color-hex').value=c" style="padding:0 10px;height:44px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:18px">🎲</button>
      </div>
    </div>
    <button class="btn-primary" onclick="saveCreator('${c.id}')">Salva modifiche</button>`;
  openModal();
}

async function saveCreator(id){
  const name=document.getElementById('ec-name').value.trim().replace(/^@/,'');
  const color=document.getElementById('ec-color').value;
  if(!name) return toast('Inserisci un handle');
  try {
    await api('PATCH','creators?id=eq.'+id,{name,color});
    const i=creators.findIndex(c=>c.id===id);
    if(i>-1){ creators[i].name=name; creators[i].color=color; }
    toast('Salvato ✓'); closeModal(); renderAll();
  } catch(e){ toast('Errore: '+e.message); }
}

async function deleteCreator(id){
  const count=links.filter(l=>l.creator_id===id).length;
  if(!confirm(count>0?`Questo creator ha ${count} link. Eliminare?`:'Eliminare questo creator?')) return;
  try {
    await api('DELETE','creators?id=eq.'+id);
    creators=creators.filter(c=>c.id!==id);
    if(currentSection&&currentSection.id===id) currentSection=null;
    toast('Eliminato'); updateStatus(); renderAll();
  } catch(e){ toast('Errore'); }
}

/* ── CRUD Cartella ── */
async function addCartella(){
  const name=document.getElementById('nk-name').value.trim();
  const color=document.getElementById('nk-color').value||randColor();
  if(!name) return toast('Inserisci un nome');
  try {
    const sort_order=cartelle.length;
    const res=await api('POST','cartelle',{name,color,sort_order});
    cartelle.push({...res[0],color});
    document.getElementById('nk-name').value='';
    toast('Cartella creata ✓'); renderViewCartella(); renderViewLink(); renderBrowse();
  } catch(e){ toast('Errore: '+e.message); }
}

function editCartella(c){
  document.getElementById('modal-title').textContent='Modifica cartella';
  document.getElementById('modal-body').innerHTML=`
    <div class="input-group"><div class="label">Nome</div>
      <input type="text" id="ek-name" value="${esc(c.name)}" /></div>
    <div class="input-group"><div class="label">Colore</div>
      <div class="color-row">
        <input type="color" id="ek-color" value="${c.color||'#5b8dd9'}" oninput="document.getElementById('ek-color-hex').value=this.value" />
        <input type="text" id="ek-color-hex" value="${c.color||'#5b8dd9'}" oninput="document.getElementById('ek-color').value=this.value" />
        <button type="button" onclick="const c=randColor();document.getElementById('ek-color').value=c;document.getElementById('ek-color-hex').value=c" style="padding:0 10px;height:44px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:18px">🎲</button>
      </div>
    </div>
    <button class="btn-primary" onclick="saveCartella('${c.id}')">Salva modifiche</button>`;
  openModal();
}

async function saveCartella(id){
  const name=document.getElementById('ek-name').value.trim();
  const color=document.getElementById('ek-color').value;
  if(!name) return toast('Inserisci un nome');
  try {
    await api('PATCH','cartelle?id=eq.'+id,{name,color});
    const i=cartelle.findIndex(c=>c.id===id);
    if(i>-1){ cartelle[i].name=name; cartelle[i].color=color; }
    toast('Salvato ✓'); closeModal(); renderAll();
  } catch(e){ toast('Errore: '+e.message); }
}

async function deleteCartella(id){
  const count=links.filter(l=>l.cartella_id===id).length;
  if(!confirm(count>0?`Questa cartella contiene ${count} link. Eliminare?`:'Eliminare?')) return;
  try {
    await api('DELETE','cartelle?id=eq.'+id);
    cartelle=cartelle.filter(c=>c.id!==id);
    links.forEach(l=>{ if(l.cartella_id===id) l.cartella_id=null; });
    if(currentSection&&currentSection.id===id) currentSection=null;
    toast('Eliminata'); renderViewCartella(); renderViewLink(); renderBrowse();
  } catch(e){ toast('Errore'); }
}

/* ── Search ── */
function onSearch(){
  const q=document.getElementById('search-input').value.trim();
  document.getElementById('search-clear').style.display=q?'inline':'none';
  if(q){
    document.getElementById('main-tabs').style.opacity='0.4';
    ['link','creator','cartella'].forEach(t=>document.getElementById('view-'+t).style.display='none');
    document.getElementById('view-browse').style.display='';
    renderSearch(q);
  } else {
    document.getElementById('main-tabs').style.opacity='';
    showMain(currentMain);
  }
}

function clearSearch(){
  document.getElementById('search-input').value='';
  document.getElementById('search-clear').style.display='none';
  document.getElementById('main-tabs').style.opacity='';
}

function renderSearch(q){
  const ql=q.toLowerCase();
  const results=links.filter(l=>{
    const cr=creators.find(c=>c.id===l.creator_id);
    const ca=cartelle.find(c=>c.id===l.cartella_id);
    return (l.title||'').toLowerCase().includes(ql)||
      (l.url||'').toLowerCase().includes(ql)||
      (cr&&cr.name.toLowerCase().includes(ql))||
      (ca&&ca.name.toLowerCase().includes(ql));
  });
  const el=document.getElementById('view-browse');
  el.className='section fade-in';
  if(!results.length){ el.innerHTML=`<div class="empty"><span class="empty-icon">🔍</span>Nessun risultato per "${esc(q)}"</div>`; return; }
  let html=`<div class="search-results-header">${results.length} risultat${results.length===1?'o':'i'}</div>`;
  results.forEach(l=>{ html+=linkCardHtml(l,q); });
  el.innerHTML=html;
}

function openModal(){ document.getElementById('modal-overlay').classList.add('open'); document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); document.getElementById('modal').classList.remove('open'); }

loadAll();
</script>
</body>
