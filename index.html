<!DOCTYPE html>
<!-- version: 1.0 -->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AI Links Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
  <style>
    :root {
      --bg: #f8f7f4;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.15);
      --text: #1a1a1a;
      --text-muted: #7a7770;
      --text-hint: #b0ada8;
      --accent: #1a1a1a;
      --accent-fg: #ffffff;
      --danger: #c0392b;
      --danger-bg: #fdf1f0;
      --radius: 10px;
      --radius-lg: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }
    .app { max-width: 480px; margin: 0 auto; padding-bottom: 100px; }

    /* Header */
    .header {
      padding: 28px 20px 16px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .header h1 { font-size: 20px; font-weight: 500; letter-spacing: -0.3px; }
    .version-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-hint);
      background: var(--bg);
      border: 0.5px solid var(--border);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .status { font-size: 12px; color: var(--text-hint); }

    /* Tabs */
    .tab-bar {
      display: flex;
      padding: 10px 16px;
      gap: 6px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
    }
    .tab {
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      border: 0.5px solid transparent;
      color: var(--text-muted);
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }
    .tab.active {
      background: var(--text);
      color: var(--accent-fg);
      font-weight: 500;
    }

    /* Content */
    .section { padding: 20px; }

    /* Folder list */
    .folder-list { display: flex; flex-direction: column; gap: 8px; }
    .folder-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.15s;
      text-decoration: none;
    }
    .folder-row:active { background: var(--bg); }
    .folder-icon { font-size: 20px; color: var(--text-muted); flex-shrink: 0; }
    .folder-name { flex: 1; font-size: 15px; color: var(--text); }
    .folder-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-hint);
      background: var(--bg);
      border: 0.5px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .folder-arrow { font-size: 16px; color: var(--text-hint); }

    /* Link cards */
    .link-card {
      padding: 14px 16px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 8px;
    }
    .link-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
    .link-actions { display: flex; gap: 8px; }
    .btn-open {
      flex: 1;
      padding: 9px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.15s;
    }
    .btn-open:active { background: #eee; }
    .btn-del {
      padding: 9px 14px;
      background: var(--danger-bg);
      border: 0.5px solid rgba(192,57,43,0.2);
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      color: var(--danger);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; gap: 4px;
      transition: background 0.15s;
    }
    .btn-del:active { background: #f9e0de; }

    /* Back button */
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-muted);
      cursor: pointer; margin-bottom: 16px;
      background: none; border: none;
      font-family: 'DM Sans', sans-serif;
      padding: 0;
    }
    .folder-heading {
      font-size: 17px; font-weight: 500;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }

    /* Form */
    .form-section-title {
      font-size: 11px; font-weight: 500;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }
    .input-group { margin-bottom: 14px; }
    .label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
    input[type=text], select {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type=text]:focus, select:focus {
      outline: none;
      border-color: var(--text);
    }
    .divider { border: none; border-top: 0.5px solid var(--border); margin: 20px 0; }
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--text);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .new-folder-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .new-folder-row input { flex: 1; }
    .btn-secondary {
      padding: 11px 16px;
      background: transparent;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }
    .btn-secondary:active { background: var(--bg); }

    /* Empty */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-hint);
      font-size: 14px;
    }
    .empty i { font-size: 36px; display: block; margin-bottom: 10px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: var(--text); color: var(--accent-fg);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .toast.show { opacity: 1; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: -2px; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fade-in */
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-top">
      <h1>AI Links Vault</h1>
      <span class="version-badge">v1.0</span>
    </div>
    <div class="status" id="status-text">Connessione in corso…</div>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('browse')" id="tab-browse">Sfoglia</button>
    <button class="tab" onclick="showTab('add')" id="tab-add">+ Aggiungi</button>
  </div>
  <div id="view-browse" class="section"></div>
  <div id="view-add" class="section" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://kyqhkromuwjenkffvkqe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5cWhrcm9tdXdqZW5rZmZ2a3FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDQ1NzAsImV4cCI6MjA5NDA4MDU3MH0.QuDYyRVZy0MSxVzd3KVT8R6I1z8BFU3kh0vgr-7BiQw';

  const H = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

  let folders = [], links = [], currentFolder = null;

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  async function api(method, path, body) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method,
      headers: { ...H, 'Prefer': method === 'POST' ? 'return=representation' : '' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) throw new Error(await r.text());
    return method === 'DELETE' ? null : r.json();
  }

  async function loadAll() {
    try {
      [folders, links] = await Promise.all([
        api('GET', 'folders?select=*&order=created_at.asc'),
        api('GET', 'links?select=*&order=created_at.desc')
      ]);
      updateStatus();
    } catch(e) {
      document.getElementById('status-text').textContent = 'Errore di connessione';
    }
    renderBrowse();
    renderAdd();
  }

  function updateStatus() {
    document.getElementById('status-text').textContent =
      folders.length + ' cartell' + (folders.length === 1 ? 'a' : 'e') +
      ' · ' + links.length + ' link';
  }

  function showTab(tab) {
    document.getElementById('view-browse').style.display = tab === 'browse' ? '' : 'none';
    document.getElementById('view-add').style.display = tab === 'add' ? '' : 'none';
    document.getElementById('tab-browse').className = 'tab' + (tab === 'browse' ? ' active' : '');
    document.getElementById('tab-add').className = 'tab' + (tab === 'add' ? ' active' : '');
    if (tab === 'browse') { currentFolder = null; renderBrowse(); }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderBrowse() {
    const el = document.getElementById('view-browse');
    el.className = 'section fade-in';
    if (currentFolder) {
      const fl = links.filter(l => l.folder_id === currentFolder.id);
      let html = `<button class="back-btn" onclick="currentFolder=null;renderBrowse()">
        <i class="ti ti-arrow-left"></i> Cartelle
      </button>
      <div class="folder-heading"><i class="ti ti-folder"></i>${esc(currentFolder.name)}</div>`;
      if (!fl.length) {
        html += `<div class="empty"><i class="ti ti-bookmark-off"></i>Nessun link in questa cartella</div>`;
      } else {
        fl.forEach(l => {
          html += `<div class="link-card">
            <div class="link-title">${esc(l.title)}</div>
            <div class="link-actions">
              <button class="btn-open" onclick="window.open(${JSON.stringify(l.url)},'_blank')">
                <i class="ti ti-external-link"></i> Apri link
              </button>
              <button class="btn-del" onclick="deleteLink('${l.id}')">
                <i class="ti ti-trash"></i>
              </button>
            </div>
          </div>`;
        });
      }
      el.innerHTML = html;
    } else {
      if (!folders.length) {
        el.innerHTML = `<div class="empty"><i class="ti ti-folder-off"></i>Nessuna cartella ancora<br><small style="margin-top:8px;display:block">Creane una nel tab Aggiungi</small></div>`;
        return;
      }
      let html = '<div class="folder-list">';
      folders.forEach(f => {
        const count = links.filter(l => l.folder_id === f.id).length;
        const fJson = esc(JSON.stringify(f));
        html += `<div class="folder-row" onclick='openFolder(${JSON.stringify(f)})'>
          <i class="ti ti-folder folder-icon"></i>
          <span class="folder-name">${esc(f.name)}</span>
          <span class="folder-count">${count}</span>
          <i class="ti ti-chevron-right folder-arrow"></i>
        </div>`;
      });
      html += '</div>';
      el.innerHTML = html;
    }
  }

  function openFolder(f) { currentFolder = f; renderBrowse(); }

  function renderAdd() {
    const el = document.getElementById('view-add');
    const opts = folders.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
    el.innerHTML = `
      <div class="form-section-title">Nuova cartella</div>
      <div class="new-folder-row">
        <input type="text" id="new-folder-name" placeholder="Nome cartella…" />
        <button class="btn-secondary" onclick="createFolder()">Crea</button>
      </div>
      <hr class="divider" />
      <div class="form-section-title">Nuovo link</div>
      <div class="input-group">
        <div class="label">Titolo</div>
        <input type="text" id="new-title" placeholder="es. Tutorial Midjourney V6" />
      </div>
      <div class="input-group">
        <div class="label">URL</div>
        <input type="text" id="new-url" placeholder="https://…" autocapitalize="none" autocorrect="off" />
      </div>
      <div class="input-group">
        <div class="label">Cartella</div>
        <select id="new-folder">${folders.length ? opts : '<option value="">— Crea prima una cartella —</option>'}</select>
      </div>
      <button class="btn-primary" onclick="addLink()" id="add-btn">Salva link</button>
    `;
  }

  async function createFolder() {
    const name = document.getElementById('new-folder-name').value.trim();
    if (!name) return toast('Inserisci un nome');
    try {
      const res = await api('POST', 'folders', { name });
      folders.push(res[0]);
      document.getElementById('new-folder-name').value = '';
      toast('Cartella creata ✓');
      updateStatus();
      renderBrowse();
      renderAdd();
    } catch(e) { toast('Errore: ' + e.message); }
  }

  async function addLink() {
    const title = document.getElementById('new-title').value.trim();
    const url = document.getElementById('new-url').value.trim();
    const folder_id = document.getElementById('new-folder').value;
    if (!title) return toast('Inserisci un titolo');
    if (!url) return toast('Inserisci un URL');
    if (!folder_id) return toast('Seleziona una cartella');
    const btn = document.getElementById('add-btn');
    btn.innerHTML = '<span class="spinner"></span>Salvataggio…';
    btn.disabled = true;
    try {
      const res = await api('POST', 'links', { title, url, folder_id });
      links.unshift(res[0]);
      document.getElementById('new-title').value = '';
      document.getElementById('new-url').value = '';
      toast('Link salvato ✓');
      updateStatus();
      renderAdd();
    } catch(e) {
      toast('Errore: ' + e.message);
      btn.innerHTML = 'Salva link';
      btn.disabled = false;
    }
  }

  async function deleteLink(id) {
    if (!confirm('Eliminare questo link?')) return;
    try {
      await api('DELETE', 'links?id=eq.' + id);
      links = links.filter(l => l.id !== id);
      toast('Eliminato');
      updateStatus();
      renderBrowse();
    } catch(e) { toast('Errore'); }
  }

  loadAll();
</script>
</body>
</html>
